name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04]
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run audit:dead-code
      - run: npm run audit:ipc
      - if: runner.os == 'Linux'
        run: npm run build:linux
      - if: runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-linux.mjs
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: myOS-Next-linux-x64-${{ github.sha }}
          path: |
            dashboard/release/*.AppImage
            dashboard/release/*.tar.gz
          if-no-files-found: error
