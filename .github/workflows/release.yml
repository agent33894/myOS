name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: arm64
            platform: macos
          - os: macos-15
            arch: x64
            platform: macos
          - os: ubuntu-24.04
            arch: x64
            platform: linux
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - if: matrix.platform == 'macos'
        run: node scripts/package-macos.mjs --arch=${{ matrix.arch }} --installer
      - if: matrix.platform == 'linux'
        run: node scripts/package-linux.mjs --arch=${{ matrix.arch }}
      - if: matrix.platform == 'linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - if: matrix.platform == 'linux'
        run: xvfb-run -a node scripts/smoke-linux.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: myOS-Next-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dashboard/release/*.dmg
            dashboard/release/*.zip
            dashboard/release/*.AppImage
            dashboard/release/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
